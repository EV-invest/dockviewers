cargo-features = ["codegen-backend"]

[workspace]
members = ["dockviewers_core", "dockviewers_dioxus", "dockviewers_leptos"]
default-members = ["dockviewers_dioxus"]
resolver = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
clap = { version = "^4.5.4", features = ["derive"] }
color-eyre = "^0.6.5"
derive-new = "^0"
dioxus = { version = "^0.7" }
dioxus-ssr = "0.7"
dockviewers_core = { path = "dockviewers_core" }
gloo-timers = "0.3"
leptos = { version = "^0.7" }
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
v_utils = { version = "^2.15.0", features = ["io", "macros", "cli"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
