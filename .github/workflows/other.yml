jobs:
  asset-gate:
    name: Asset gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - id: bucket
      name: Interval bucket
      run: echo "key=asset-gate-docs--readme_assets-fuzz-svg-$(( $(date -u +%s) /
        86400 ))" >> $GITHUB_OUTPUT
    - id: guard
      name: Has this interval been checked
      uses: actions/cache/restore@v4
      with:
        key: ${{ steps.bucket.outputs.key }}
        path: .asset-gate-stamp
    - if: steps.guard.outputs.cache-hit != 'true'
      name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - if: steps.guard.outputs.cache-hit != 'true'
      name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - if: steps.guard.outputs.cache-hit != 'true'
      name: Regenerate docs/.readme_assets/fuzz.svg and compare
      run: "export ASSET_OUT=\"$(mktemp -d)/$(basename docs/.readme_assets/fuzz.svg)\"\
        \nnix run .#film\nif ! cmp -s docs/.readme_assets/fuzz.svg \"$ASSET_OUT\"\
        ; then\n  echo \"::error file=docs/.readme_assets/fuzz.svg::docs/.readme_assets/fuzz.svg\
        \ no longer matches its generator — regenerate and commit it: nix run .#film\"\
        \n  exit 1\nfi\necho \"docs/.readme_assets/fuzz.svg is current\"\n: > .asset-gate-stamp\n"
    - if: steps.guard.outputs.cache-hit != 'true'
      name: Record this interval as checked
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.bucket.outputs.key }}
        path: .asset-gate-stamp
  loc-badge:
    name: Update LOC Badge
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - env:
        loc_gist_token: ${{ secrets.loc_gist_token }}
      name: Ensure loc_gist_token secret is configured
      run: "if [ -z \"${loc_gist_token}\" ]; then\n  echo \"::error::Secret 'loc_gist_token'\
        \ is not set (empty in this job).\"\n  if [ \"${{ github.event.repository.private\
        \ }}\" = \"true\" ]; then\n    echo \"::error::This repo is PRIVATE. On GitHub\
        \ Free-plan orgs, organization secrets are NOT exposed to private repos —\
        \ if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set\
        \ it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}),\
        \ or upgrade the org to Team/Enterprise.\"\n  else\n    echo \"::error::Add\
        \ it under Settings → Secrets and variables → Actions (repo-level, or org-level\
        \ with 'All repositories' visibility — org secrets reach public repos on any\
        \ plan).\"\n  fi\n  echo \"::error::Create a token, then: gh secret set loc_gist_token\
        \ --repo <owner>/<repo> --body YOUR_TOKEN\"\n  echo \"::error::Bulk-provision\
        \ all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash\"\
        \n  exit 1\nfi\n"
    - name: Install tokei
      run: cargo install tokei
    - id: count
      name: Count lines of code
      run: '# Extract repository name (e.g., "valeratrades/readme-fw" -> "readme-fw")

        PNAME="${GITHUB_REPOSITORY##*/}"

        echo "pname=$PNAME" >> $GITHUB_OUTPUT


        LOC=$(tokei --output json | jq ''.Total.code'')

        echo "loc=$LOC" >> $GITHUB_OUTPUT

        echo "Lines of code for $PNAME: $LOC"


        # Generate JSON with project-specific filename

        echo "{\"schemaVersion\": 1, \"label\": \"LoC\", \"message\": \"$LOC\", \"color\":
        \"lightblue\"}" > ${PNAME}-loc.json

        '
    - name: Display generated JSON
      run: cat ${{ steps.count.outputs.pname }}-loc.json
    - name: Update gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        file_path: ${{ steps.count.outputs.pname }}-loc.json
        gist_id: b48e6f02c61942200e7d1e3eeabf9bcb
        token: ${{ secrets.loc_gist_token }}
name: Other
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
