name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli,wasm-bindgen-cli@0.2.125
      # base_path is baked into the wasm at compile time; setting it breaks local `dx serve`
      # (Dioxus #2285), so it lives only here in CI, never committed.
      - name: Write ephemeral Dioxus.toml
        run: |
          cat > dockviewers_dioxus/Dioxus.toml <<'EOF'
          [web.app]
          base_path = "dockview_dioxus"
          EOF
      - name: Build wasm
        run: dx build --release --platform web --example insilico --package dockviewers_dioxus
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/insilico/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
