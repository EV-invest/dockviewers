[package]
name = "dockviewers_dioxus"
version = "0.1.10"
edition = "2024"
description = "Dioxus binding for the dockviewers packed-grid tiling layout — panes split, resize, tab, float, and maximize, saved to JSON and restored on reload. Drives the framework-agnostic dockviewers_core engine."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/dockviewers"
documentation = "https://docs.rs/dockviewers_dioxus"
readme = "../README.md"
keywords = ["dioxus", "layout", "docking", "tiling", "wasm"]
categories = ["gui", "wasm"]

# A packed-grid tiling layout for Dioxus. Web-only (DOM-backed).
[lib]

# `web` is default so `dx serve --example insilico` infers the platform (web) with no
# `--platform` flag — dx reads it from the enabled renderer feature. `dioxus/web` still
# compiles on the host, so native `cargo test` stays green. Consumers on another renderer
# set `default-features = false`.
[features]
default = ["web"]
web = ["dioxus/web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "HtmlElement", "DomRect", "Node", "NodeList", "EventTarget", "KeyboardEvent", "MouseEvent", "PointerEvent", "console"] }

[dependencies]
dioxus.workspace = true
dockviewers_core.workspace = true

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

# Examples live at the repo root (workspace level), so point back in from the package.
[[example]]
name = "insilico"
path = "../examples/insilico/main.rs"

[lints]
workspace = true
